name: PR Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Xcode tests
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      # Official action: https://github.com/actions/checkout
      # Resolved from v6.0.2 on 2026-05-19.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run all shared scheme tests
        run: |
          rm -f /tmp/mac-meet-log-screen-ocr-benchmark.txt
          xcodebuild test \
            -project meet-log/meet-log.xcodeproj \
            -scheme meet-log \
            -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/meet-log-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Report test failures
        if: failure()
        run: |
          if [ -d "$RUNNER_TEMP/meet-log-tests.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/meet-log-tests.xcresult"
          fi

      - name: Report screen OCR benchmark
        run: |
          cat /tmp/mac-meet-log-screen-ocr-benchmark.txt
          cat /tmp/mac-meet-log-screen-ocr-benchmark.txt >> "$GITHUB_STEP_SUMMARY"
